<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GlitchPop — Where Ideas Come Alive</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root{--ink:#14141a;--mute:#6b6f7a;--line:#ececf1}
  *{box-sizing:border-box}
  html{overflow:hidden}
  html,body{margin:0;background:radial-gradient(520px 620px at 4% 52%,rgba(120,165,255,.30),transparent 70%),radial-gradient(700px 500px at 100% 0,rgba(150,240,200,.18),transparent 70%),#fff;background-attachment:fixed;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:3;pointer-events:none}

  /* brand (from the GlitchPop banner) */
  .brand{position:fixed;z-index:7;top:clamp(10px,1.6vw,22px);left:clamp(14px,2.6vw,38px);display:block;text-decoration:none}
  .brand img{display:block;height:clamp(54px,6.4vw,84px);width:auto;mix-blend-mode:multiply;
    -webkit-mask-image:radial-gradient(ellipse 53% 57% at 50% 52%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 53% 57% at 50% 52%,#000 72%,transparent 100%)}

  /* buy bar: price + quantity + add to cart, under the hero */
  .buy{position:fixed;z-index:5;left:calc(50% + 7vw);transform:translateX(-50%);display:flex;align-items:center;gap:14px;
    padding:8px 8px 8px 22px;border-radius:999px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(20,22,32,.08);box-shadow:0 18px 36px -18px rgba(20,22,40,.35),0 2px 6px rgba(20,22,40,.06);
    transition:opacity .4s,transform .4s}
  .buy.out{opacity:0;transform:translateX(-50%) translateY(8px)}
  .price{font-size:26px;font-weight:700;letter-spacing:.02em;color:#14161f;font-variant-numeric:tabular-nums}
  .price .cur{font-size:.7em;font-weight:700;margin-right:.1em;color:inherit}
  .qty{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:#f1f2f6}
  .qty button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:500;
    color:#14161f;transition:background .2s,transform .15s}
  .qty button:hover{background:#fff}.qty button:active{transform:scale(.9)}
  .qty button:disabled{opacity:.3;cursor:default;background:none}
  .qty output{min-width:26px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:#14161f}
  .add{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;height:46px;padding:0 24px;border-radius:999px;background:#14161f;color:#fff;
    font-size:14px;font-weight:600;letter-spacing:.01em;box-shadow:0 10px 20px -10px rgba(20,22,40,.7);transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .3s}
  .add:hover{transform:translateY(-1px);background:#262a38}.add:active{transform:scale(.97)}
  .add.done{background:#1f9d55}
  .add svg{width:17px;height:17px}
  /* cart pill, top right */
  .cart{position:fixed;z-index:9;top:clamp(14px,2vw,26px);right:clamp(16px,3vw,44px);display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 14px;
    border-radius:999px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(20,22,32,.08);
    box-shadow:0 12px 26px -16px rgba(20,22,40,.4);font-size:14px;font-weight:600;color:#14161f;font-variant-numeric:tabular-nums;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
  .cart svg{width:18px;height:18px}
  .cart .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#14161f;color:#fff;font-size:11px;display:grid;place-items:center}
  .cart.bump{transform:scale(1.1)}
  /* cart drawer with payment QR codes */
  .cart{cursor:pointer;all:unset;cursor:pointer;position:fixed;z-index:9;top:clamp(14px,2vw,26px);right:clamp(16px,3vw,44px);display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 14px;
    border-radius:999px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(20,22,32,.08);
    box-shadow:0 12px 26px -16px rgba(20,22,40,.4);font-size:14px;font-weight:600;color:#14161f;font-variant-numeric:tabular-nums;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
  .cart:focus-visible{outline:2px solid #14161f;outline-offset:3px}
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(18,20,30,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(420px,100vw);display:flex;flex-direction:column;background:#fff;
    box-shadow:-30px 0 60px -30px rgba(18,20,40,.35);transform:translateX(104%);transition:transform .5s cubic-bezier(.22,1,.36,1)}
  .drawer.on{transform:none}
  .dh{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 14px}
  .dh h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#14161f}
  .x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#14161f;background:#f1f2f6;transition:background .2s}
  .x:hover{background:#e6e8ee}
  .lines{padding:0 24px;display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
  .line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef0f4}
  .line img{width:44px;height:44px;object-fit:contain;flex:none}
  .line .nm{flex:1;font-size:14px;font-weight:600;color:#14161f}
  .line .nm small{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:12px;font-weight:500;color:#8a8e9c}
  .prod{border-bottom:1px solid #eef0f4;padding:6px 0 8px}
  .prod .line{border-bottom:0;padding:6px 0}
  .prod .head .pq{font-size:13px;font-weight:600;color:#6c7080}
  .prod .sub{padding-left:56px}
  .prod .sub .nm{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:#3b3f4d}
  .chip{display:inline-flex;width:16px;height:16px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px rgba(20,22,32,.18)}
  .chip i{flex:1;display:block}
  .line .st{display:flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:#f1f2f6}
  .line .st button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
  .line .st button:hover{background:#fff}
  .line .st output{min-width:20px;text-align:center;font-size:13px;font-weight:600}
  .line .amt{min-width:44px;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .empty{padding:26px 0;text-align:center;color:#8a8e9c;font-size:14px}
  .total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 24px 8px;font-size:13px;color:#6c7080}
  .total b{font-size:30px;font-weight:700;letter-spacing:-.03em;color:#14161f}
  .tabs{display:flex;gap:6px;margin:6px 24px 0;padding:4px;border-radius:999px;background:#f1f2f6}
  .tabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 0;border-radius:999px;font-size:13px;font-weight:600;color:#6c7080;transition:background .25s,color .25s,box-shadow .25s}
  .tabs button[aria-selected="true"]{background:#fff;color:#14161f;box-shadow:0 4px 10px -4px rgba(20,22,40,.25)}
  .qr{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px 24px 22px}
  .qr .frame{width:min(250px,60vw);aspect-ratio:1;border-radius:22px;padding:12px;background:#fff;border:1px solid #eceef3;box-shadow:0 16px 34px -20px rgba(20,22,40,.35);display:grid;place-items:center}
  .qr img{width:100%;height:100%;object-fit:contain;border-radius:12px}
  .qr .miss{font-size:13px;color:#8a8e9c;text-align:center;line-height:1.5;padding:0 14px}
  .qr .note{font-size:13px;color:#6c7080;text-align:center}
  .qr .note b{color:#14161f}
  .welcome{position:fixed;inset:0;z-index:6;pointer-events:none}
  .brand{transition:opacity .9s .5s}body.intro .brand{opacity:0}
  .welcome .twel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transform:scale(.94);transition:opacity .9s,transform 1.4s cubic-bezier(.22,1,.36,1)}
  .welcome .twel.on{opacity:1;transform:scale(1);pointer-events:auto}
  .welcome .twel small{font-size:13px;letter-spacing:.55em;text-transform:uppercase;color:#7a7f90;font-weight:600;opacity:0;transform:translateY(10px);margin-right:-.55em}
  .welcome .twel.on small{animation:wup .8s .15s cubic-bezier(.22,1,.36,1) forwards}
  .welcome .wlogo{width:min(520px,72%);mix-blend-mode:multiply;opacity:0;position:relative;z-index:1}
  .welcome .twel.on .wlogo{animation:wpop 1.25s .35s cubic-bezier(.34,1.56,.64,1) forwards,wfloat 4.5s 1.7s ease-in-out infinite}
  .welcome .tstart{display:inline-flex;align-items:center;gap:12px;margin-top:10px;padding:8px 24px 8px 8px;border:0;border-radius:999px;background:#14161f;color:#fff;font:600 14px/1 inherit;font-family:inherit;letter-spacing:.04em;cursor:pointer;opacity:0;transform:translateY(14px);box-shadow:0 18px 36px -14px rgba(14,18,40,.6);transition:transform .25s,box-shadow .25s,background .25s}
  .welcome .twel.on .tstart{animation:wup .8s 1.5s cubic-bezier(.22,1,.36,1) forwards}
  .welcome .tstart:hover{transform:translateY(-2px) scale(1.03);background:#000;box-shadow:0 24px 40px -14px rgba(14,18,40,.7)}
  .welcome .tstart .pl{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#19c37d,#2f7dff);color:#fff;padding-left:2px}
  .welcome .tstart .pl::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #2f7dff;animation:wring 2s 2.3s ease-out infinite;opacity:0}
  .welcome .blobs i{position:absolute;border-radius:50%;opacity:0;filter:blur(.3px)}
  .welcome .twel.on .blobs i{animation:wblob 5s ease-in-out infinite}
  .welcome .blobs i:nth-child(1){left:14%;top:22%;width:22px;height:22px;background:radial-gradient(circle at 30% 30%,#fff,#19c37d 60%);animation-delay:.5s}
  .welcome .blobs i:nth-child(2){left:80%;top:18%;width:30px;height:30px;background:radial-gradient(circle at 30% 30%,#fff,#2f7dff 60%);animation-delay:.9s}
  .welcome .blobs i:nth-child(3){left:8%;top:62%;width:16px;height:16px;background:radial-gradient(circle at 30% 30%,#fff,#ff8a3d 60%);animation-delay:1.3s}
  .welcome .blobs i:nth-child(4){left:88%;top:60%;width:20px;height:20px;background:radial-gradient(circle at 30% 30%,#fff,#a35bff 60%);animation-delay:.7s}
  .welcome .blobs i:nth-child(5){left:26%;top:80%;width:26px;height:26px;background:radial-gradient(circle at 30% 30%,#fff,#2f7dff 60%);animation-delay:1.7s}
  .welcome .blobs i:nth-child(6){left:70%;top:82%;width:18px;height:18px;background:radial-gradient(circle at 30% 30%,#fff,#19c37d 60%);animation-delay:1.1s}
  .welcome .blobs i:nth-child(7){left:50%;top:10%;width:14px;height:14px;background:radial-gradient(circle at 30% 30%,#fff,#ff8a3d 60%);animation-delay:1.5s}
  @keyframes wup{to{opacity:1;transform:none}}
  @keyframes wpop{0%{opacity:0;transform:scale(.35) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes wfloat{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-9px) rotate(.6deg)}}
  @keyframes wring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
  @keyframes wblob{0%{opacity:0;transform:translateY(24px) scale(.5)}25%{opacity:.9}70%{opacity:.9}100%{opacity:0;transform:translateY(-34px) scale(1.15)}}
  /* menu host (React + Tailwind component renders here) */
  #menu-root{position:fixed;z-index:2;left:50%;top:47%;transform:translate(-50%,-50%);transform-origin:50% 50%;will-change:filter}
  .choose{position:fixed;z-index:2;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;font-size:13px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:#8b90a0;pointer-events:none}
  .info.out,.buy.out,.swatches.out{pointer-events:none}
  .info,.buy{left:50%}
  .swatches{left:calc(50% + clamp(230px,20vw,320px))}
  .brand{transition:none}

  /* colour buttons: rounded squares, above the title */
  .swatches{display:flex;flex-direction:row;gap:12px;align-items:center;transition:opacity .35s}
  .swatches.out{opacity:0;pointer-events:none}
  .sw{all:unset;cursor:pointer;position:relative;width:44px;height:44px;border-radius:14px;overflow:hidden;
    display:flex;flex-direction:row;box-shadow:0 0 0 1px rgba(20,20,26,.28),0 8px 14px -8px rgba(0,0,0,.35);opacity:.9;
    transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .25s,box-shadow .25s}
  .sw.wide{width:68px;height:38px;border-radius:13px}
  .sw i{flex:1;display:block}
  .sw::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(135deg,rgba(255,255,255,.4) 0,rgba(255,255,255,0) 45%)}
  .sw:hover{transform:scale(1.12);opacity:1}
  .sw[aria-pressed="true"]{opacity:1;transform:scale(1.1);box-shadow:0 0 0 3px #fff,0 0 0 5.5px #14141a,0 10px 18px -8px rgba(0,0,0,.45)}
  .sw:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* product copy, right */
  .info{position:fixed;z-index:4;left:calc(50% + 7vw);top:clamp(100px,14vh,128px);transform:translateX(-50%);
    text-align:center;transition:opacity .4s,transform .4s}
  .info.out{opacity:0;transform:translateX(-50%) translateY(-8px)}
  .info h2{margin:0;max-width:min(30vw,420px);font-family:"Inter","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
    font-size:clamp(14px,1.3vw,20px);line-height:1.3;font-weight:600;letter-spacing:.28em;text-transform:uppercase;text-wrap:balance;
    color:#1d2029;text-shadow:none}
  /* colours: slim vertical stack to the right of the product */
  .swatches{position:fixed;z-index:4;left:calc(50% + 7vw + clamp(250px,22vw,330px));top:50%;transform:translateY(-50%);
    flex-direction:column;gap:16px}
  .info p{margin:0;font-size:16px;line-height:1.55;color:var(--mute)}
  .info .tag{display:inline-block;margin-bottom:18px;padding:6px 12px;border-radius:999px;background:#f4f5f8;font-size:12px;
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

  @media (max-width:820px){
    .info{left:50%;top:64px}
    .buy{left:50%;gap:8px;padding-left:14px}.price{font-size:20px}
      .swatches{left:auto;right:14px}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.info{transition:none!important}}
</style>
</head>
<body class="intro">
<canvas id="gl"></canvas>
<div class="welcome" id="welcome"><div class="twel on" id="twel"><div class="blobs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><small>Welcome to</small><img class="wlogo" src="/brand/glitchpop-logo.jpg" alt="GlitchPop — Where Ideas Come Alive"><button class="tstart" id="tstart"><span class="pl"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg></span>Start the tour</button></div></div>


<a class="brand" href="#" aria-label="GlitchPop — Where Ideas Come Alive"><img src="/brand/glitchpop-logo.jpg" alt="GlitchPop — Where Ideas Come Alive" /></a>

<div id="menu-root"></div>
<p class="choose" id="choose">Choose your product</p>

<div class="buy" id="buy">
  <span class="price" id="price"></span>
  <div class="qty" role="group" aria-label="Quantity">
    <button type="button" id="qminus" aria-label="Less">&minus;</button><output id="qval" aria-live="polite">1</output><button type="button" id="qplus" aria-label="More">+</button>
  </div>
  <button type="button" class="add" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span id="addlabel">Add to cart</span></button>
</div>
<button type="button" class="cart" id="cart" aria-haspopup="dialog" aria-label="Open cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span class="n" id="cartn">0</span><span id="carttotal">$0</span></button>


<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Your cart" aria-hidden="true">
  <div class="dh"><h3>Your cart</h3><button class="x" id="dclose" aria-label="Close">&times;</button></div>
  <div class="lines" id="lines"></div>
  <div class="total"><span>Total</span><b id="dtotal">$0</b></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="qr" id="qr"></div>
</aside>

<aside class="info" id="info"><h2 id="name"></h2></aside>
<div class="swatches" id="swatches" role="group" aria-label="Colour"></div>


<script type="module" src="/src/main.js"></script>
</body>
</html>
